<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Final CSS</title>
    <style>
        * {
            text-align: center;
        }

        img {
            width: 300px;
            height: 200px;
        }

        #type1 {
            color: salmon;
        }

        #type2 {
            background-color: lightskyblue;
        }

        #type3 {
            color: magenta;
            font-family: 'Times New Roman';
        }

        #type4 {
            color: rgb(40, 218, 23);
            text-decoration: underline;

        }

        .borda {
            border: 1px solid yellowgreen;
        }
        #type5{
            color: darkred;
            font-size: 42px;
        }
    </style>
</head>

<body>
    <h1>PÁGINA TESTE CSS</h1>
    <hr>
    <img src="_Images/css01.jpeg" alt="CSSIMAGE1">
    <img src="_Images/css02.jpeg" alt="CSSIMAGE2">
    <img src="_Images/css03.jpeg" alt="CSSIMAGE3">
    <img src="_Images/css04.jpeg" alt="CSSIMAGE4">
    <hr>
    <h2 id="type1">CSS É VIDA"</h2>
    <p>Diversas possibilidades de incrementar seu HTML</p>
    <h1>Exemplo de Cores no CSS</h1>
    <p id="type2"><b>Exemplo de texto com cor de fundo</b></p>
    <hr>
    <p id="type3"><b><i>Exemplo de texto com mudanças da cor da fonte</i></b></p>
    <hr>
    <p class="borda">Exemplo de texto com borda colorida</p>
    <h1>Misturando Tudo</h1>
    <p class="borda" id="type4">Exemplo de texto com várias formatações</p>
    <hr>
    <p id="type5">Mais em exemplo</p>

</body>

</html>
